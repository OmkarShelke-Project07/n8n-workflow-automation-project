name: Validate Workflows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Check for exposed secrets
        shell: bash
        run: |
          set -euo pipefail
          FAILED=0

          echo "Checking workflow exports for common hardcoded secrets..."

          if grep -RPnE 'Bearer[[:space:]]+[A-Za-z0-9._-]{20,}' workflows/ | grep -v '\$env\.' | grep -v '\$\{\{' ; then
            echo "::error::Hardcoded bearer token detected."
            FAILED=1
          fi

          if grep -RPnE '"(access_token|api_key|password|refresh_token)"[[:space:]]*:[[:space:]]*"[^"<{]+"' workflows/ ; then
            echo "::error::Potential hardcoded credential detected."
            FAILED=1
          fi

          if grep -RPn 'sk-[A-Za-z0-9_-]{20,}' workflows/ ; then
            echo "::error::Potential OpenAI-style API key detected."
            FAILED=1
          fi

          if grep -RPnE '[A-Za-z0-9._%+-]+@(gmail|outlook|yahoo)\.(com|in)' workflows/ ; then
            echo "::error::Personal email address detected."
            FAILED=1
          fi

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi

          echo "No common hardcoded secret patterns detected."

      - name: Validate JSON syntax
        shell: bash
        run: |
          set -euo pipefail
          FAILED=0
          for file in workflows/*/workflow.json; do
            if jq empty "$file" >/dev/null 2>&1; then
              echo "OK: $file"
            else
              echo "ERROR: Invalid JSON in $file"
              FAILED=1
            fi
          done
          [ "$FAILED" -eq 0 ]

      - name: Check workflow structure
        shell: bash
        run: |
          set -euo pipefail
          for file in workflows/*/workflow.json; do
            jq -e '.name and (.nodes | type == "array") and (.connections | type == "object")' "$file" >/dev/null
            echo "OK: $file"
          done

      - name: Check workflow exports are inactive
        shell: bash
        run: |
          set -euo pipefail
          FAILED=0
          for file in workflows/*/workflow.json; do
            if jq -e '.active == true' "$file" >/dev/null 2>&1; then
              echo "ERROR: $file is exported as active"
              FAILED=1
            fi
          done
          [ "$FAILED" -eq 0 ]

      - name: Check for README files
        shell: bash
        run: |
          set -euo pipefail
          for dir in workflows/*/; do
            if [ ! -f "$dir/README.md" ]; then
              echo "ERROR: Missing README.md in $dir"
              exit 1
            fi
          done

      - name: List workflow count
        run: find workflows -mindepth 1 -maxdepth 1 -type d | wc -l
